# Preview only. Do not deploy this file to the live lou-receptionist worker.
name = "lou-receptionist-preview"
main = "worker/entry.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[alias]
"body-parser" = "./worker/stubs/body-parser.js"
"iconv-lite" = "./worker/stubs/iconv-lite.js"

[vars]
MOCK_MODE = "true"
SEED_DEMO = "true"
DATA_FILE = "/tmp/lou.json"
LLM_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai/"
LLM_MODEL = "gemini-3.5-flash"
PAYPAL_API_BASE = "https://api-m.sandbox.paypal.com"

[[rules]]
type = "Text"
globs = ["public/**"]
fallthrough = true
